# component
CONFIG_MCUX_COMPONENT_component.common_task=y
CONFIG_MCUX_COMPONENT_middleware.edgefast_open=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_MCUX_COMPONENT_utility.assert_lite=n
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=n
CONFIG_MCUX_COMPONENT_utility.shell=y
CONFIG_MCUX_COMPONENT_driver.wm8962=y
CONFIG_MCUX_COMPONENT_component.audio_sai_edma_adapter=y
CONFIG_MCUX_PRJSEG_middleware.freertos-kernel.generated_config=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_customize_folder=y
CONFIG_MCUX_PRJSEG_project.hw_app_customize_folder=y

# config
CONFIG_BT_BLE_DISABLE=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="sco_bridge"
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP=y

# HFP HF (Hands-Free) configuration
CONFIG_BT_HFP_HF=y
CONFIG_BT_HFP_HF_CODEC_NEG=y
CONFIG_BT_HFP_HF_CODEC_MSBC=y
CONFIG_BT_HFP_HF_HF_INDICATORS=y
CONFIG_BT_HFP_HF_HF_INDICATOR_ENH_SAFETY=y
CONFIG_BT_HFP_HF_HF_INDICATOR_BATTERY=y
CONFIG_BT_HFP_HF_VOICE_RECG=y
CONFIG_BT_HFP_HF_3WAY_CALL=y
CONFIG_BT_HFP_HF_INDICATOR=y

# HFP AG (Audio Gateway) configuration
CONFIG_BT_HFP_AG=y
CONFIG_BT_HFP_AG_HF_INDICATORS=y
CONFIG_BT_HFP_AG_HF_INDICATOR_ENH_SAFETY=y
CONFIG_BT_HFP_AG_HF_INDICATOR_BATTERY=y
CONFIG_BT_HFP_AG_3WAY_CALL=y
CONFIG_BT_HFP_AG_CODEC_NEG=y
CONFIG_BT_HFP_AG_CODEC_MSBC=y
CONFIG_BT_HFP_AG_VOICE_RECG=y

# Common Bluetooth configuration
CONFIG_BT_RFCOMM=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_COD=0x200408
CONFIG_BT_BUF_ACL_RX_SIZE=1300
CONFIG_BT_DEFAULT_ROLE_SWITCH_ENABLE=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=3

# BR/EDR Connection Parameters
# Page timeout: 0x8000 = 20.48 seconds (default 0x2000 = 5.12 seconds)
# Increase timeout for devices that are slow to respond or at edge of range
CONFIG_BT_PAGE_TIMEOUT=0x8000
CONFIG_BT_MAX_SCO_CONN=2
CONFIG_BT_ACCEPT_CONN_AS_CENTRAL=y
# Debug console configuration
CONFIG_DEBUG_CONSOLE_RX_ENABLE=n
CONFIG_DEBUG_CONSOLE_SYNCHRONIZATION_MODE=1
CONFIG_FSL_OSA_MAIN_FUNC_ENABLE=n

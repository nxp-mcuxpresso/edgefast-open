# component
CONFIG_MCUX_ABSTRACT_COMPONENT_component_expander=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.config=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.IW61X=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.board_murata_2el_m2=y
CONFIG_MCUX_COMPONENT_driver.wm8962=y
CONFIG_MCUX_COMPONENT_component.audio_sai_edma_adapter=y
CONFIG_MCUX_DEPENDENCY_COMPONENT_middleware.wifi.template_DEPEND_ANYOF_OPTION_2=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.config=y
CONFIG_MCUX_DEPENDENCY_COMPONENT_component.timer_manager_DEPEND_component.timer_manager_lpit=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm85_non_trustzone=y
CONFIG_MCUX_COMPONENT_driver.pcal6524=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_customize_folder=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y
# config
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
# bt_keys_link_key_update_usage() is only defined when CONFIG_BT_SETTINGS is
# enabled (see host/classic/keys_br.c), but conn.c calls it whenever
# CONFIG_BT_KEYS_OVERWRITE_OLDEST is set. With settings storage disabled the
# oldest-key aging tracking cannot be persisted, so disable it to avoid the
# undefined reference at link time.
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n

